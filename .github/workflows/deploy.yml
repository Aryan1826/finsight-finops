
name: FinSight FinOps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: finsight-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: finsight-finops
  TF_DIR: terraform/root

jobs:
  deploy:
    name: Test and Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Run tests
      - name: Run application tests
        run: |
          python -m pytest -q tests

      # 5. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # 6. Check Terraform formatting
      - name: Terraform format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

            - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);



      # 7. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::575458732659:role/finsight-finops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 8. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 9. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 10. Initialize Terraform
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # 11. Validate Terraform configuration
      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # 12. Generate Terraform plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            -var="image_tag=${GITHUB_SHA}"

      # 13. Build Docker image
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      # 14. Push image to Amazon ECR
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 15. Apply the saved Terraform plan
      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
