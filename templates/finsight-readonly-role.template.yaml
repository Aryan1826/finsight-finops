AWSTemplateFormatVersion: '2012-10-17'
Description: >
  FinSight — Cloud Cost Optimization & Governance (FinOps) Read-Only Role Stack.
  Creates the least-privilege IAM role and policy required for FinSight to perform
  read-only resource inventory discovery, CloudWatch metric analysis, and Cost Explorer spend tracking.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "FinSight Connection Configuration"
        Parameters:
          - FinSightProductionTaskRoleArn
          - ExternalId
          - RoleName
    ParameterLabels:
      FinSightProductionTaskRoleArn:
        default: "FinSight Execution Role ARN"
      ExternalId:
        default: "Tenant External ID"
      RoleName:
        default: "IAM Role Name"

Parameters:
  FinSightProductionTaskRoleArn:
    Type: String
    Description: "The AWS IAM Role ARN of the deployed FinSight application permitted to assume this role."
    AllowedPattern: '^arn:aws[a-z\-]*:iam::\d{12}:role\/[\w+=,.@\/-]+$'
    ConstraintDescription: "Must be a valid AWS IAM Role ARN (e.g. arn:aws:iam::123456789012:role/FinSightProductionTaskRole)."

  ExternalId:
    Type: String
    Description: "The unique External ID generated by FinSight to protect against confused deputy attacks."
    MinLength: 16
    MaxLength: 128
    ConstraintDescription: "External ID must be between 16 and 128 characters."

  RoleName:
    Type: String
    Default: "FinSightReadOnlyRole"
    Description: "The name for the cross-account read-only IAM role."
    MinLength: 1
    MaxLength: 64

Resources:
  FinSightReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: "Read-only cross-account role for FinSight Cloud Cost Optimization & Governance"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref FinSightProductionTaskRoleArn
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: FinSightReadOnlyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: FinSightIdentityRead
                Effect: Allow
                Action:
                  - 'sts:GetCallerIdentity'
                Resource: '*'
              - Sid: FinSightEC2Read
                Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeTags'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeSecurityGroups'
                Resource: '*'
              - Sid: FinSightCloudWatchRead
                Effect: Allow
                Action:
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:ListMetrics'
                Resource: '*'
              - Sid: FinSightCostExplorerRead
                Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostAndUsageWithResources'
                Resource: '*'

Outputs:
  RoleArn:
    Description: "The ARN of the created read-only IAM role. Copy and paste this into FinSight."
    Value: !GetAtt FinSightReadOnlyRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  RoleName:
    Description: "The name of the created read-only IAM role."
    Value: !Ref FinSightReadOnlyRole

  ExternalId:
    Description: "The External ID configured in the trust policy condition."
    Value: !Ref ExternalId
